[workspace]
resolver = "2"
members = [
    "crates/stemsplits-stft",
    "crates/stemsplits-demucs",
    "crates/stemsplits-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/wavey-ai/stemsplits"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
